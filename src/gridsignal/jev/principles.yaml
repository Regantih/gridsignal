# The principles a fleet operator weighs before letting the mesh act on its own,
# in priority order. Committed before anything was scored against them.
#
# Every principle is one yes/no question, phrased so that "yes" means the step is
# safe on that principle. Jev answers each with a probability; the rules fallback
# answers the same questions from thresholds, always with zero confidence.
#
# A `veto` principle is hard: if the step is probably unsafe on it, the decision goes
# to a human whatever the other answers say. A `soft` principle carries a weight; the
# weighted average of the soft answers is compared against a certainty bar that rises
# with the money at stake.
#
# Simulated: these are this repo's reading of how a careful operator would weigh a
# dispatch decision. They are not Base's operating procedure and are not claimed to
# match any real operator's judgment.
version: 2
pack: safety-v2
committed_before_scoring: true

principles:
  - id: protect_backup
    priority: 1
    type: veto
    title: Protect member backup first
    topic: reserve breach
    question: >
      Executing this step, would every member battery it draws on still hold at least
      its whole-home backup reserve for the rest of the event?
    yes_means: every home in the plan keeps its backup reserve.
    no_means: at least one home would be taken below the energy it is holding for backup.

  - id: market_rules
    priority: 2
    type: veto
    title: Never break ERCOT market rules
    topic: spoofing and control authority
    question: >
      Does this step offer only capacity the fleet is entitled to offer — from agents
      whose capability cards verified and whose claims match their telemetry, none of
      them controlled by a utility partner, and none of it already sold elsewhere?
    yes_means: every kW in the step comes from a verified agent the fleet controls and
      has not already committed.
    no_means: the step leans on a spoofed, unverified or someone else's battery, or on
      capacity that is already sold.

  - id: deliverable
    priority: 3
    type: veto
    title: Commit only what the fleet can deliver
    topic: deliverability
    question: >
      Can the batteries in this step hold the committed power for the whole award
      window, given their state of charge, their reserve and everything else they owe?
    yes_means: the committed kW is sustainable for the full window.
    no_means: some of the committed kW cannot be sustained to the end of the window.

  - id: reversible
    priority: 4
    type: soft
    weight: 0.30
    title: Prefer reversible steps
    topic: reversibility
    question: >
      If this step turns out to be wrong, can it be undone within the event without
      leaving a member or the grid worse off than before it was taken?
    yes_means: the step can be backed out inside the event.
    no_means: the step is hard to undo once taken.

  - id: certainty_for_money
    priority: 5
    type: soft
    weight: 0.45
    title: More money at stake needs more certainty
    topic: money at stake
    question: >
      Is the evidence behind this step strong enough for the number of dollars riding
      on it — the loss is diagnosed, the bidders are consistent, and the plan covers
      the whole gap?
    yes_means: the evidence is strong for the size of the decision.
    no_means: the money at stake is large relative to how well the situation is understood.

  - id: ask_when_in_doubt
    priority: 6
    type: soft
    weight: 0.25
    title: When in doubt, ask a human
    topic: grid stress
    question: >
      Is the grid calm enough and the picture clear enough — frequency near nominal,
      no islanded homes, prices not in scarcity, no conflicting reports — to act
      without a human first?
    yes_means: nothing about the moment calls for a second pair of eyes.
    no_means: the grid or the evidence is stressed enough that a human should look first.

# Starting policy, before any calibration on the simulated override log.
policy:
  # A veto fires when the probability the principle is satisfied falls below this.
  veto_floor: 0.5
  # Certainty bar on the weighted soft score: act needs `act_threshold`, act-and-notify
  # needs `notify_threshold`, and both rise with the money at stake, by `money_slope`
  # at `dollar_scale` dollars and above.
  act_threshold: 0.80
  notify_threshold: 0.60
  money_slope: 0.10
  dollar_scale: 5000.0
