name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,capture]"
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: no-crash sweep (every CLI entry point and every screen, keyless and offline)
        run: python scripts/no_crash_sweep.py --json sweep.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: no-crash-sweep
          path: sweep.json
      - name: benchmark (10,000 agents, p50/p95/throughput/memory)
        run: python -m gridsignal.perf --sizes 10000 --repeats 3 --json perf.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: perf.json
