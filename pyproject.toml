[project]
name = "gridsignal"
version = "0.1.0"
description = "ERCOT grid data to battery dispatch signals"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "streamlit>=1.35",
  "plotly>=5.20",
  "python-dotenv>=1.0",
  # Chaos scenarios for the agent mesh are declared in YAML.
  "pyyaml>=6.0",
  # Timezone database for machines without system tzdata (slim containers, Windows).
  "tzdata>=2024.1",
  # Calls to Jev, the decision layer. Only used when an API key is set; the default
  # run replays recorded fixtures and makes no network calls.
  "httpx>=0.27",
  # The twin's price world model and fleet stress test (gridsignal.twin).
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pytest-xdist>=3.6",
    "matplotlib>=3.8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
# The GridSignal web app's API (api/), served with the built front end from one process.
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]
# Only needed for the live-ERCOT pipeline, not for the Control Room demo.
ercot = ["gridstatus>=0.27", "scikit-learn>=1.4"]
# Only needed for scripts/capture_demo.py, the scripted screen recording.
capture = ["playwright>=1.44"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Jev principle pack is read at import time, so it must ship with the package.
gridsignal = ["jev/*.yaml"]

[tool.pytest.ini_options]
# The heavy end of the suite: whole-fleet scenario sweeps, the AppTest renders and the
# reports that recompute a study. CI runs them as their own parallel job, so neither half
# has to wait for the other; `pytest` with no marker still runs everything.
markers = ["slow: fleet-scale sweeps, app renders and full reports"]
# Whole modules go to one worker, so the module-scoped fixtures that share a single
# AppTest render and a single report across their tests are still built once.
addopts = "--dist loadscope"
# api/ is a top-level package next to src/, so its tests import it from the repo root.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gridsignal", "api"]

[tool.ruff.lint.per-file-ignores]
# Generates a prose report: long human sentences read better unbroken.
"src/gridsignal/twin/report.py" = ["E501"]
# The app puts this checkout's src/ on sys.path before importing gridsignal (stale host installs).
"app/dashboard.py" = ["E402"]
