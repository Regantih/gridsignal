[project]
name = "gridsignal"
version = "0.1.0"
description = "ERCOT grid data to battery dispatch signals"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "streamlit>=1.35",
  "plotly>=5.20",
  "python-dotenv>=1.0",
  # Chaos scenarios for the agent mesh are declared in YAML.
  "pyyaml>=6.0",
  # Timezone database for machines without system tzdata (slim containers, Windows).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
# Only needed for the live-ERCOT pipeline, not for the Control Room demo.
ercot = ["gridstatus>=0.27", "scikit-learn>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
