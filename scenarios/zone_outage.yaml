name: Zone gateway outage
description: >
  Every battery in LZ_HOUSTON drops off at once (regional uplink outage) while the
  grid event is live. The remaining zones have to cover a fifth of the commitment.
seed: 42
agents:
  batteries: 1000
event:
  scenario: scarcity
stale_after_s: 120
duration_s: 900
approval:
  approver: M. Alvarez (Fleet Operator)
  delay_s: 90
coordinator:
  llm: false
injections:
  - kind: zone_outage
    zone: LZ_HOUSTON
    at_s: 45

# The whole LZ_HOUSTON gateway drops.
ground_truth:
  root_cause: gateway_outage
