name: Neighborhood islands on its own batteries
description: >
  A simulated distribution outage cuts one load zone off, and the homes there island on
  their own batteries, mini-grid style. Every islanded home's stored energy belongs to
  that home until the feeder is restored, so the mesh must cover the lost export from
  the rest of the fleet and must never award an islanded home's backup. The outage is
  simulated; no distribution system is involved.
held_out: true
seed: 42
agents:
  batteries: 1000
event:
  scenario: scarcity
stale_after_s: 120
duration_s: 1200
approval:
  approver: M. Alvarez (Fleet Operator)
  delay_s: 60
coordinator:
  llm: false
injections:
  - kind: island
    zone: LZ_AUSTIN
    at_s: 45

# The homes and their batteries are healthy; a distribution-side outage separated them
# from the grid, which is the same shape of cause as a gateway losing a group.
ground_truth:
  root_cause: gateway_outage
  note: >
    Simulated feeder outage islanding one zone. Success is zero homeowner backup
    reserve violations, not maximum export.
