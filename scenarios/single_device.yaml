name: Single device offline
description: >
  The demo story as an agent negotiation: BAT-042 stops answering during the scarcity
  event and the mesh re-buys its committed kW from neighbours, behind human approval.
seed: 42
agents:
  batteries: 48
event:
  scenario: scarcity
stale_after_s: 120
duration_s: 600
approval:
  approver: M. Alvarez (Fleet Operator)
  delay_s: 60
coordinator:
  llm: false
injections:
  - kind: device_failure
    devices: [BAT-042]
    at_s: 45
